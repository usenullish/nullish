name: E2E Tests

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nullish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d nullish"
          --health-interval 5s

      mailpit:
        image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare-e2e

      - name: Run tests
        run: bun run e2e:ci

      - name: Upload results on failure
        uses: ./.github/actions/upload-e2e-results
        if: ${{ failure() }}

  may-merge:
    needs: ["e2e"]
    runs-on: ubuntu-latest
    steps:
      - name: Cleared for merging
        run: echo OK
