name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nullish
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U username -d nullish"
          --health-interval 5s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Tests
        run: bun test

  may-merge:
    needs: ["tests"]
    runs-on: ubuntu-latest
    steps:
      - name: Cleared for merging
        run: echo OK
