name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_amd64:
    name: Build ${{ matrix.image }} for amd64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            image: usenullish/server
            file: ./Dockerfile.server

          - name: client
            image: usenullish/client
            file: ./Dockerfile.client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          name: ${{ matrix.name }}
          image: ${{ matrix.image }}
          file: ${{ matrix.file }}
          platform: linux/amd64
          arch: amd64
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

  build_arm64:
    name: Build ${{ matrix.image }} for arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: server
            image: usenullish/server
            file: ./Dockerfile.server

          - name: client
            image: usenullish/client
            file: ./Dockerfile.client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          name: ${{ matrix.name }}
          image: ${{ matrix.image }}
          file: ${{ matrix.file }}
          platform: linux/arm64
          arch: arm64
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

  merge:
    name: Push ${{ matrix.image }} to Docker Hub
    runs-on: ubuntu-latest
    needs: [build_amd64, build_arm64]
    strategy:
      matrix:
        include:
          - name: server
            image: usenullish/server

          - name: client
            image: usenullish/client
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
