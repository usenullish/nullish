name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - image: usenullish/server
            file: ./Dockerfile.server

          - image: usenullish/client
            file: ./Dockerfile.client

    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0

    permissions:
      contents: read
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ${{ matrix.file }}
      meta-images: ${{ matrix.image }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}

    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
