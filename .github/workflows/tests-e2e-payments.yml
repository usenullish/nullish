name: E2E Payments Tests

on:
  pull_request:
    paths:
      - "e2e/payments/**"
      - "packages/payments/**"
      - "packages/admin/src/subscription/**"
      - "packages/engine/src/subscription/**"
      - "packages/server/src/api/resources/_organizations+payments+*.ts"
      - "packages/server/src/api/resources/_subscription+*.ts"
      - "packages/client/app/components/settings/subscription/**"
      - "packages/client/app/routes/*subscription*"

jobs:
  e2e-payments:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nullish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d nullish"
          --health-interval 5s

      stripe-mock:
        image: stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports:
          - 12111:12111

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare-e2e

      - name: Bootstrap subscription
        run: NODE_ENV=development bun run --env-file=.env.e2e.payments packages/cli/src/index.ts subscription bootstrap e2e/fixtures/subscription/subscription.stripe-mock.json

      - name: Seed
        run: NODE_ENV=development bun run --env-file=.env.e2e.payments e2e/seed/payments.seed.ts

      - name: Run tests
        run: bun run e2e:payments:ci

      - name: Upload results on failure
        uses: ./.github/actions/upload-e2e-results
        if: ${{ failure() }}
