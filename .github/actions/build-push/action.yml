name: Build and push

description: Build an image for one platform and push it by digest

inputs:
  name:
    description: Short name of the image, used to name the digest artifact
    required: true
  image:
    description: Docker Hub image
    required: true
  file:
    description: Dockerfile
    required: true
  platform:
    description: Target platform, e.g. linux/amd64
    required: true
  arch:
    description: Architecture of the platform, e.g. amd64
    required: true
  docker_username:
    description: Docker Hub username
    required: true
  docker_token:
    description: Docker Hub access token
    required: true

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Extract metadata (labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ inputs.name }}-${{ inputs.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
